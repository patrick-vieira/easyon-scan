{% extends 'base.html' %}{% block content %}<div class="intro"><h1>{{ t.capture }}</h1><a href="{{ url_for('index',lang=lang,reference=selected,reference_frontal='true' if frontal else '') }}">{{ t.back }}</a></div><section class="card"><p>{{ t.tips_text }}</p><p>{{ t.camera_caution }}</p><p class="notice">{{ t.camera_help }}</p><div class="actions"><button id="start" class="primary">{{ t.start }}</button><button id="stop" disabled>{{ t.stop }}</button></div><video id="video" autoplay muted playsinline aria-label="{{ t.capture }}"></video><p id="status" role="status" aria-live="polite">{{ t.stopped }}</p><p id="lights" aria-live="polite">{{ t.waiting }}</p><form id="capture" action="{{ url_for('index',lang=lang) }}" method="post" enctype="multipart/form-data"><input type="hidden" name="lang" value="{{ lang }}"><input type="hidden" name="reference" value="{{ selected }}"><input type="hidden" name="reference_frontal" value="{{ 'true' if frontal else '' }}"><input id="photo" type="file" name="photo" hidden required>{% include 'advanced.html' %}<button id="shoot" type="button" disabled class="primary">{{ t.shoot }}</button></form></section>
<script>const t={{ t|tojson }},checkUrl={{ url_for('capture_check',lang=lang)|tojson }},reference={{ selected|tojson }},frontal={{ ('true' if frontal else '')|tojson }};</script><script>{% include 'capture-script.html' %}</script>{% endblock %}
