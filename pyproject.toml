[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyon-scan"
version = "0.1.0"
description = "Measure flat paper patterns from photographs using ArUco markers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["opencv-python-headless>=4.8,<5", "numpy>=1.26,<3", "ezdxf>=1.3,<2", "shapely>=2,<3", "pillow>=10.1,<13", "flask>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
easyon-scan = "easyon_scan.cli:main"

[tool.setuptools.packages.find]
include = ["easyon_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
