[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyon-scan"
version = "0.2.0"
description = "Measure flat paper patterns from photographs using ArUco markers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["opencv-contrib-python-headless==4.11.0.86", "numpy>=1.26,<3", "ezdxf==1.4.3", "shapely>=2,<3", "pillow>=10.1,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "flask>=3,<4"]
web = ["flask>=3,<4"]

[project.scripts]
easyon-scan = "easyon_scan.cli:main"

[tool.setuptools.packages.find]
include = ["easyon_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: synthetic measurement benchmarks"]

[tool.setuptools.package-data]
easyon_scan = ["templates/*.html", "static/*.css", "static/*.js", "schemas/*.json", "media/*.jpg", "media/*.vtt"]
